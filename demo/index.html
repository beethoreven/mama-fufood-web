<!doctype html>
<!-- 由 demo/tools/build.py 從正式版的 index.html 產生，不要手改。 -->
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <script>
    // 示範版跟正式版同一個網域,localStorage 是共用的:這一頁所有的 key 加上前綴,
    // 讀不到正式版的管理員 session,也不會寫進正式版的資料。一定要在其他 script 之前執行。
    (function () {
      var PREFIX = "demo:";
      var S = Storage.prototype;
      var getItem = S.getItem, setItem = S.setItem, removeItem = S.removeItem;
      S.getItem = function (k) { return getItem.call(this, PREFIX + k); };
      S.setItem = function (k, v) { return setItem.call(this, PREFIX + k, v); };
      S.removeItem = function (k) { return removeItem.call(this, PREFIX + k); };
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>媽媽記副食品</title>
  <meta name="description" content="記錄寶寶副食品的 App：吃了什麼、吃多少、有沒有過敏狀況。紀錄只存在你的手機與你自己的 Google 雲端硬碟。">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="top">
    <img src="../favicon.png" alt="">
    <span class="title">媽媽記副食品</span>
    <span id="account" class="muted"></span>
    <div id="gsi"></div>
    <button id="demo-guest" type="button" hidden>不用 Google 帳號直接進入</button>
    <a id="admin-link" class="btn primary" href="admin.html" hidden>管理後台</a>
  </header>
  <main>
    <nav class="tabs" id="tabs">
      <button data-doc="" class="active">介紹</button>
      <button data-doc="terms">使用者條款</button>
      <button data-doc="privacy">隱私權政策</button>
      <button data-doc="judgement_guide">判斷邏輯說明</button>
    </nav>
    <article class="card legal" id="doc" hidden></article>
    <div id="intro">
      <div class="card">
        <div class="row">
          <img src="../icon_256.png" alt="App 圖示" width="96" height="96" style="border-radius: 22px">
          <div class="grow">
            <h1 style="margin: 0; font-size: 22px">媽媽記副食品</h1>
            <p style="margin: 6px 0 0">記錄寶寶的副食品：每次吃了什麼、吃多少、有沒有過敏狀況、寶寶喜不喜歡，
              並整理成月曆、統計與簡單的判斷結果。</p>
          </div>
        </div>
      </div>
      <div class="card">
        <h2 style="margin-top: 0; font-size: 17px">你的資料只在你手上</h2>
        <ul>
          <li>寶寶的名稱、紀錄與照片只存在你的手機，或你自己的 Google 雲端硬碟（開啟雲端功能時）。</li>
          <li>匯出檔整份加密，只能用匯出時的 Google 帳號匯入；我們拿不到金鑰。</li>
          <li>沒有廣告，也沒有任何分析工具。</li>
        </ul>
        <p class="muted">本 App 僅供記錄與參考，非基於醫學知識做的判斷。寶寶有任何反應，請諮詢醫師。</p>
      </div>
      <div class="card">
        <h2 style="margin-top: 0; font-size: 17px">下載</h2>
        <p class="row" id="apk" hidden>
          <a id="apk-link" class="btn primary" href="">下載最新版媽媽記副食品</a>
          <span id="apk-version" class="muted"></span>
        </p>
        <p id="play">目前尚未在 Google Play 上架。</p>
      </div>
    </div>
    <p id="login-note" class="muted"></p>
  </main>
  <footer>阿舍老師</footer>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="fixtures.js"></script>
  <script src="api.js"></script>
  <script src="../js/md.js"></script>
  <script src="../js/home.js"></script>
  <script>
    // 示範版:不用 Google 帳號也能進後台。登入後(出現「管理後台」入口)就藏起來。
    (function () {
      var b = document.getElementById("demo-guest");
      var admin = document.getElementById("admin-link");
      function sync() { b.hidden = !!window.mamaFufoodApi.token() && !admin.hidden; }
      b.hidden = !!window.mamaFufoodApi.token();
      new MutationObserver(sync).observe(admin, { attributes: true });
      b.onclick = function () { window.mamaFufoodApi.setToken("demo"); location.reload(); };
    })();
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer onload="window.mamaFufoodHomeGsiReady && window.mamaFufoodHomeGsiReady()"
    onerror="document.getElementById('login-note').textContent = '無法載入 Google 登入元件（不影響瀏覽網站）。'"></script>
</body>
</html>
